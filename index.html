<style>
:root,[data-theme="default"]{--bg:#ebe8ff;--surface:#fff;--ink:#1d1a4a;--muted:#6a679a;--line:#d6d1f5;--accent:#e2407f;--gold:#f2b632;color-scheme:light}
[data-theme="dark"]{--bg:#171538;--surface:#221f55;--ink:#f0eeff;--muted:#a9a5dd;--line:#38347a;--accent:#e2407f;--gold:#f2b632;color-scheme:dark}
[data-theme="amethyst"]{--bg:#2b1850;--surface:#3a2268;--ink:#f3eaff;--muted:#c3a9ee;--line:#54368f;--accent:#9d4edd;--gold:#f2b632;color-scheme:dark}
[data-theme="emerald"]{--bg:#e1f6ec;--surface:#fff;--ink:#0f3d2e;--muted:#4c7a69;--line:#bfe5d3;--accent:#0b8a5e;--gold:#e0a21c;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px}
.bar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:22px}
.bar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
select{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;font-size:14px}
h1{font:800 clamp(26px,6vw,40px)/1.15 Unbounded,sans-serif;margin:0 0 8px}
p.sub{margin:0 0 20px;color:var(--muted)}
input{width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ol{list-style:none;margin:0;padding:0;display:grid;gap:12px}
li{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px 10px 16px}
li.empty{justify-content:center;color:var(--muted)}
.pos{font:800 22px Unbounded,sans-serif;min-width:2.2ch;color:var(--muted)}
li:first-child .pos{color:var(--gold)}
.thumb{flex:none;width:128px;aspect-ratio:16/9;border-radius:8px;background:var(--line);object-fit:cover;display:block}
.thumb.none{display:grid;place-items:center;color:var(--muted);font-size:12px}
.info{min-width:0;flex:1}
.name{font-weight:700;margin:0;overflow-wrap:anywhere}
.by{color:var(--muted);font-size:14px}
.hero{background:#1d1a4a url(header-bg.jpg) right center/cover no-repeat;border-radius:18px;padding:30px 22px 34px;margin:0 0 18px;box-shadow:0 4px 0 var(--line)}
.hero h1{...background:linear-gradient(90deg,#ff5e5e,#ffb347,#ffe66d,#5eead4,#60a5fa,#c084fc,#ff5e5e);...animation:rainbow 6s linear infinite}
.hero p.sub{color:#ffd166;margin:0;max-width:34ch}
.tabs{display:flex;gap:8px;margin:0 0 16px}
.tabs button{flex:1;font:inherit;font-weight:700;color:var(--muted);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tabs button:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;padding-bottom:3px}
.links a{font-size:13px;font-weight:700;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:2px 10px;text-decoration:none}
.links a.show{background:var(--accent);border-color:var(--accent);color:#fff}
.links button.music{background:linear-gradient(90deg,var(--line) var(--p,0%),transparent var(--p,0%));font:inherit;font-size:13px;font-weight:700;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:2px 10px;cursor:pointer}
.links button.music[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.disc{position:absolute;top:12px;right:14px;width:88px;height:88px;pointer-events:none;opacity:0;transform:translateX(150px);transition:transform .5s cubic-bezier(.2,.9,.3,1.15),opacity .3s}
.disc.in{opacity:1;transform:translateX(0)}
.disc i{position:relative;display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 3px 10px rgba(0,0,0,.28);animation:spin 2.2s linear infinite;
  background:radial-gradient(circle,var(--surface) 0 8%,rgba(0,0,0,.18) 8% 10%,var(--accent) 10% 30%,transparent 30%),
  conic-gradient(#eceaf8,#9fb4ff,#f6c8ee,#eceaf8,#a8f0d8,#fff1b0,#eceaf8,#b9a8ff,#eceaf8)}
.spectro{flex:1 1 100%;height:0;margin-top:-14px;overflow:hidden;opacity:0;pointer-events:none;transition:height .35s ease,margin-top .35s ease,opacity .3s}
.spectro.in{height:64px;margin-top:0;opacity:1}
.spectro canvas{display:block;width:100%;height:64px}
.disc-art{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.disc-label{position:absolute;left:27%;top:27%;width:46%;height:46%;border-radius:50%;object-fit:cover;background:var(--line);box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.disc i b{position:absolute;left:46%;top:46%;width:8%;height:8%;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(0,0,0,.45)}
@keyframes spin{to{transform:rotate(360deg)}}
li.playing .info{padding-right:96px}
@media (prefers-reduced-motion:reduce){.disc i{animation:none}}
.links a,.links button.music{box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.links a.show{box-shadow:0 3px 0 rgba(0,0,0,.28)}
.links a:active,.links button.music:active{transform:translateY(3px);box-shadow:0 0 0 transparent}

@media (max-width:520px){li{flex-wrap:wrap}.thumb{width:100%;order:3}.info{flex:1 1 60%}.bar{justify-content:flex-start}}
</style>

<script>
/* ===== LEVEL DETAILS (set once, never needs moving) =====
   The ranking order is in lists.js. Here you only add info for each level.
   The name must match the name in lists.js exactly.
   creator  = who made it
   showcase = showcase video link (YouTube gives an automatic thumbnail)
   link     = play/download link (optional)
   thumb    = own thumbnail, e.g. "thumbs/level1.jpg" (optional)
   music    = short audio file for the preview (optional), in your repo, e.g.
              "music/level1.mp3". Adds a Preview button. Audio only, no video.
   musicStart  = second the preview starts at (optional, default 0), e.g. 45
   musicEnd    = second the preview stops at (optional, default start + 15), e.g. 62
              The preview stops by itself at that second. */
const INFO = {
  "The Samsara": { creator:"Pegasi", showcase:"https://youtu.be/fHpiDxDjP-c?si=pZHpi6iKYursBlzd", link:"https://drive.google.com/open?id=13Q3hbsj9C-HHp-X_0yoCwqbp7qJF3FEQ", thumb:"thumbs/maxresdefault.jpg", music:"Music/Samsara.mp3", musicStart:17, musicEnd:35 },
  "The Rock":    { creator:"Theo5970", showcase:"https://youtu.be/B25iHCA_dlc?si=WfM0OUuxUWQVd40H", link:"https://drive.google.com/file/d/1cocUO-wXCbHOXoDvGAI6ML0MthUaOztc/view?usp=drivesdk", thumb:"thumbs/thumb1.jpg", music:"Music/Rock.mp3", musicStart:0, musicEnd:15 },
  "White Realm II": { creator: "CXY-Chen", showcase:"https://youtu.be/u12OrH1eGAc?si=FZAuAbo8XxsgwvTn", link:"https://m.chinadlrs.com", music:"Music/WhiteRealm2.mp3", musicStart:1, musicEnd:15 },
  "Storm of Anger": { creator: "FengYan", showcase:"https://youtu.be/GqeARenMMcQ?si=YRV-qUKmsd7Tg_0m", link:"https://m.chinadlrs.com", music:"Music/Storm.mp3", musicStart:25, musicEnd:40 },
  "The Mathematics": { creator: "LigaYb", showcase:"https://youtu.be/sjy8oRq-T-8?si=pDvegGsXTXSOdIdQ", link:"https://drive.google.com/file/d/10DS2tOt2BnyKB8yvyYXLmOjicn5M0pvb/view", music:"Music/Mathmathetics.mp3", musicStart:0, musicEnd:15 },
  "The Forest": { creator:"LigaYb", showcase:"https://youtu.be/HteGhvnTkEc?si=4BaRB4is2vSBRFYb", link:"https://drive.google.com/file/d/1uA-hmnKmr1brlph6ES5Tfij2Nf7QRrPV/view", music:"Music/Forest.mp3", musicStart:0, musicEnd:15 },
  "The Garden": { creator:"LigaYb", showcase:"https://youtu.be/pa8VUG0Yh6Y?si=ZiZSU4PSrQMeIFoC", music:"Music/Garden.mp3", musicStart:1, musicEnd:15 },
  "The Jupiter": { creator:"LigaYb", showcase:"https://youtu.be/n1SU05OKMdc?si=ud1c4qU5FFFFF4AS", music:"Music/Jupiter.mp3", musicStart:4, musicEnd:15 },
  "The Chemistry": { creator:"LigaYb", showcase:"https://youtu.be/O-ZQYh2wz6U?si=Dd2VE6MNnMalvwsP", music:"Music/Chemistry.mp3", musicStart:3, musicEnd:15 },
  "The Gemini": { creator:"LigaYb", showcase:"https://youtu.be/x5BikB9-4o4?si=whklt6cLTTHjK24j", link:"https://drive.google.com/file/d/1IgfNPjNV2Os558QbnAjYMeu1I93nWiuk/view?usp=sharing", music:"Music/Gemini.mp3", musicStart:1, musicEnd:15 },
  "The Cubic World": { creator:"LigaYb", showcase:"https://youtu.be/O1W5C3_hyoc?si=ej2i0AnnTDuhQvX-", link:"https://drive.google.com/file/d/1xqdg9GHF4VOLPbcenbp3hxTHdxpiGSYS/view", music:"Music/CubicWorld.mp3", musicStart:4, musicEnd:15 },
  "The Insanity": { creator:"SixSquares", showcase:"https://youtu.be/pVz74oYRTJI?si=ZcEJZQYSURiNXFpj", thumb:"thumbs/insanity.jpg", music:"Music/Insanity.mp3", musicStart:4, musicEnd:15 },
  "The Storm Hard": { creator:"YeZhiYi", showcase:"https://youtu.be/PWMtW0dlQyY?si=m8DAuyV5ipsHrit7", thumb:"thumbs/stormv2.jpg", music:"Music/Storm.mp3", musicStart:93, musicEnd:110 }
};

/* ===== MUSIC TAB DETAILS =====
   The ranking order is in musiclist.js. Here you add info for each song.
   artist = who made the song
   link   = listen link, YouTube works best (adds a Listen button)
   thumb  = cover image, e.g. "thumbs/song1.jpg" (optional, YouTube link gives one automatically)
   music, musicStart, musicEnd = preview clip, same as for levels */
const MUSIC_INFO = {
  "The Hollowness":   { artist:"MaxStudio", thumb:"thumbs/hollowness.jpg", music:"Music/hollowness.mp3", musicStart:0, musicEnd:211 },
  "Rainy Garden":   { artist:"Tatajuo", thumb:"thumbs/RainyGarden.jpg", music:"Music/rainygarden.mp3", musicStart:0, musicEnd:97 },
};

/* ===== TEXT IN EACH LANGUAGE (add more languages here later) ===== */
const TEXT = {
  en: { language:"Language", theme:"Theme", amethyst:"Amethyst", default:"Default", dark:"Dark", emerald:"Emerald",
        title:"Dancing Line Fanmade Level Lists", sub:"A List for Dancing Line Fanmade Levels",
        search:"Search levels", by:"by", showcase:"Showcase", play:"Play", noThumb:"No thumbnail", music:"Preview", stop:"Stop", noAudio:"Audio not found",
        thumbAlt:"Thumbnail of", none:"No levels match.",
        tabLevels:"Levels", tabMusic:"Music", subMusic:"Songs from Dancing Line Fanmade Levels", listen:"Listen",
        viz:"Preview style", vizDisc:"Disc", vizSpectro:"Spectrogram" },
  vi: { language:"Ngôn ngữ", theme:"Giao diện", amethyst:"Thạch anh tím", default:"Mặc định", dark:"Tối", emerald:"Ngọc lục bảo",
        title:"Danh sách các Level Dancing Line do Fan làm", sub:"Một danh sách cho các Level Dancing Line do Fan Làm",
        search:"Tìm level", by:"bởi", showcase:"Xem showcase", play:"Chơi", noThumb:"Không có ảnh bìa", music:"Nghe thử", stop:"Dừng", noAudio:"Không tìm thấy âm thanh",
        thumbAlt:"Ảnh bìa của", none:"Không tìm thấy level nào.",
        tabLevels:"Level", tabMusic:"Nhạc", subMusic:"Các Bài Nhạc của các Level Dancing Line do Fan Làm", listen:"Nghe",
        viz:"Kiểu xem trước", vizDisc:"Đĩa", vizSpectro:"Phổ âm thanh" }
};

/* ===== Nothing below needs editing ===== */
const LEVELS = LIST.split("\n").map(x => x.trim()).filter(x => x && !x.startsWith("//"))
  .map(name => ({ name, creator:"", showcase:"", link:"", thumb:"", ...(INFO[name] || {}) }));
const MUSICS = (typeof MUSIC_LIST === "undefined" ? "" : MUSIC_LIST).split("\n").map(x => x.trim()).filter(x => x && !x.startsWith("//"))
  .map(name => { const m = MUSIC_INFO[name] || {};
    return { name, creator:m.artist || "", showcase:m.link || "", link:"", thumb:m.thumb || "", music:m.music, musicStart:m.musicStart, musicEnd:m.musicEnd }; });
let tab = location.hash === "#music" ? "music" : "levels";
const DATA = () => tab === "music" ? MUSICS : LEVELS;
const list = document.getElementById("list"), q = document.getElementById("q");
const langSel = document.getElementById("lang"), themeSel = document.getElementById("theme");
const THEMES = ["amethyst","default","dark","emerald"];
let lang = "en";
const T = () => TEXT[lang];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isUrl = u => /^https?:\/\//i.test(u || "");
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} }
};
function ytId(u){
  const m = String(u || "").match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : "";
}
function thumbOf(l){
  if (l.thumb) return l.thumb;
  const id = ytId(l.showcase);
  return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : "";
}
function thumbFail(img){
  const d = document.createElement("div");
  d.className = "thumb none";
  d.textContent = T().noThumb;
  img.replaceWith(d);
}
function render(){
  stopMusic();
  const t = q.value.trim().toLowerCase(), x = T();
  const rows = DATA().map((l,i) => ({l,i}))
    .filter(({l}) => !t || (l.name + " " + l.creator).toLowerCase().includes(t));
  if (!rows.length) { list.innerHTML = `<li class="empty">${esc(x.none)}</li>`; return; }
  list.innerHTML = rows.map(({l,i}) => {
    const th = thumbOf(l);
    const img = th ? `<img class="thumb" src="${esc(th)}" alt="${esc(x.thumbAlt)} ${esc(l.name)}" loading="lazy" onerror="thumbFail(this)">`
                   : `<div class="thumb none">${esc(x.noThumb)}</div>`;
    const links = (isUrl(l.showcase) ? `<a class="show" href="${esc(l.showcase)}" target="_blank" rel="noopener">${esc(tab === "music" ? x.listen : x.showcase)}</a>` : "")
                + (isUrl(l.link) ? `<a href="${esc(l.link)}" target="_blank" rel="noopener">${esc(x.play)}</a>` : "")
                + (l.music && !ytId(l.music) ? `<button type="button" class="music" data-i="${i}" aria-pressed="false">&#9654; ${esc(x.music)}</button>` : "");
    return `<li><span class="pos">${i+1}</span>${img}<div class="info"><p class="name">${esc(l.name)}</p><div class="by">${esc(x.by)} ${esc(l.creator)}</div><div class="links">${links}</div></div></li>`;
  }).join("");
}
const DISC_IMAGE = "disc.png"; // your own disc picture, e.g. "disc.png" (put it in your repo)
const FADE_IN = 1, FADE_OUT = 1.5; // fade lengths in seconds, change if you like
let audio = null, curBtn = null, curDisc = null, curLi = null, curSpec = null, actx = null;
let viz = store.get("dl-viz") === "spectro" ? "spectro" : "disc";
const vizSel = document.getElementById("viz");
function canAnalyse(src){
  try { return /^https?:$/.test(location.protocol) && new URL(src, location.href).origin === location.origin && !!(window.AudioContext || window.webkitAudioContext); }
  catch(e) { return false; }
}
function startDisc(li, l){
  const d = document.createElement("div"), art = thumbOf(l);
  d.className = "disc";
  d.innerHTML = `<i><img class="disc-art" src="${esc(DISC_IMAGE)}" alt="" onerror="this.style.display='none'">`
    + (art ? `<img class="disc-label" src="${esc(art)}" alt="" onerror="this.style.display='none'">` : "")
    + `<b></b></i>`;
  li.appendChild(d); li.classList.add("playing");
  curDisc = d;
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add("in")));
}
function startSpectro(li, a){
  const el = document.createElement("div");
  el.className = "spectro";
  el.innerHTML = "<canvas></canvas>";
  li.appendChild(el);
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const src = actx.createMediaElementSource(a), an = actx.createAnalyser();
    an.fftSize = 256; an.smoothingTimeConstant = 0.78;
    src.connect(an); an.connect(actx.destination);
    const cv = el.querySelector("canvas"), dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.max(40, el.clientWidth), H = 64;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    const color = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#e2407f";
    const g = ctx.createLinearGradient(0, H, 0, 0);
    g.addColorStop(0, color + "66"); g.addColorStop(1, color);
    const buf = new Uint8Array(an.frequencyBinCount), n = 40, gap = 3, bw = (W - gap * (n - 1)) / n;
    curSpec = { el, src, an };
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
    return () => {
      an.getByteFrequencyData(buf);
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = g;
      for (let i = 0; i < n; i++) {
        const bin = Math.min(buf.length - 1, Math.floor(Math.pow(i / n, 1.6) * buf.length * 0.75));
        const h = Math.max(3, buf[bin] / 255 * (H - 4)), x = i * (bw + gap);
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, H - h, bw, h, Math.min(3, bw / 2)); else ctx.rect(x, H - h, bw, h);
        ctx.fill();
      }
    };
  } catch(e) { el.remove(); curSpec = null; return null; }
}
function resetBtn(b){ b.setAttribute("aria-pressed","false"); b.style.removeProperty("--p"); b.innerHTML = "&#9654; " + esc(T().music); }
function stopMusic(){
  if (audio) { audio.pause(); audio = null; }
  if (curBtn) { if (curBtn.isConnected) resetBtn(curBtn); curBtn = null; }
  if (curDisc) {
    const d = curDisc;
    d.classList.remove("in");
    setTimeout(() => d.remove(), 600);
    curDisc = null;
  }
  if (curSpec) {
    const sp = curSpec;
    try { sp.src.disconnect(); sp.an.disconnect(); } catch(e) {}
    sp.el.classList.remove("in");
    setTimeout(() => sp.el.remove(), 600);
    curSpec = null;
  }
  if (curLi) { curLi.classList.remove("playing"); curLi = null; }
}
list.addEventListener("click", e => {
  const b = e.target.closest("button.music");
  if (!b) return;
  const wasOn = b === curBtn;
  stopMusic();
  if (wasOn) return;
  const l = DATA()[b.dataset.i];
  const start = Math.max(0, parseInt(l.musicStart, 10) || 0);
  let end = parseInt(l.musicEnd, 10);
  if (!(end > start)) end = start + (Math.max(1, parseInt(l.musicLength, 10)) || 15);
  const len = end - start;
  const a = new Audio(l.music + "#t=" + start);
  audio = a; curBtn = b;
  const li = b.closest("li");
  curLi = li;
  let draw = null;
  if (viz === "spectro" && canAnalyse(l.music)) draw = startSpectro(li, a);
  if (!draw) startDisc(li, l);
  b.setAttribute("aria-pressed","true");
  b.innerHTML = "&#9632; " + esc(T().stop);
  const fi = Math.min(FADE_IN, len / 2), fo = Math.min(FADE_OUT, len / 2);
  let looping = false;
  a.volume = 0;
  const tick = () => {
    if (audio !== a) return;
    const t = a.currentTime - start;
    if (t >= len) { stopMusic(); return; }
    a.volume = Math.max(0, Math.min(1, t / fi, (len - t) / fo));
    b.style.setProperty("--p", Math.max(0, t / len * 100) + "%");
    if (draw) draw();
    requestAnimationFrame(tick);
  };
  a.addEventListener("playing", () => {
    if (a.currentTime < start - 0.5) a.currentTime = start;
    if (!looping) { looping = true; requestAnimationFrame(tick); }
  });
  a.addEventListener("ended", () => { if (audio === a) stopMusic(); });
  a.addEventListener("error", () => {
    if (audio !== a) return;
    stopMusic();
    b.textContent = T().noAudio;
    setTimeout(() => { if (b.isConnected && b !== curBtn) resetBtn(b); }, 2500);
  });
  a.play().catch(() => { if (audio === a) a.dispatchEvent(new Event("error")); });
});
function setLang(v){
  lang = TEXT[v] ? v : "en";
  document.documentElement.lang = lang;
  langSel.value = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T()[el.dataset.t]);
  document.getElementById("sub").textContent = tab === "music" ? T().subMusic : T().sub;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  q.placeholder = T().search;
  q.setAttribute("aria-label", T().search);
  document.title = T().title;
  store.set("dl-lang", lang);
  render();
}
function setTheme(v){
  v = THEMES.includes(v) ? v : "default";
  document.documentElement.dataset.theme = v;
  themeSel.value = v;
  store.set("dl-theme", v);
}
langSel.addEventListener("change", () => setLang(langSel.value));
themeSel.addEventListener("change", () => setTheme(themeSel.value));
vizSel.value = viz;
vizSel.addEventListener("change", () => { viz = vizSel.value === "spectro" ? "spectro" : "disc"; store.set("dl-viz", viz); });
q.addEventListener("input", render);
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  tab = b.dataset.tab === "music" ? "music" : "levels";
  history.replaceState(null, "", tab === "music" ? "#music" : location.pathname + location.search);
  q.value = "";
  setLang(lang);
});
window.addEventListener("hashchange", () => { tab = location.hash === "#music" ? "music" : "levels"; q.value = ""; setLang(lang); });
setTheme(store.get("dl-theme"));
setLang(store.get("dl-lang") || ((navigator.language || "").toLowerCase().startsWith("vi") ? "vi" : "en"));
</script>
