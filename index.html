<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A List for Dancing Line Fanmade Levels">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.jpg">

     IMPORTANT: replace https://YOURNAME.github.io/ below with your real site address (3 places). -->

<title>Dancing Line Fanmade Level Lists</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;600;700&display=swap&subset=vietnamese,latin-ext" rel="stylesheet">
<style>
:root,[data-theme="default"]{--bg:#ebe8ff;--surface:#fff;--ink:#1d1a4a;--muted:#6a679a;--line:#d6d1f5;--accent:#e2407f;--gold:#f2b632;color-scheme:light}
[data-theme="dark"]{--bg:#171538;--surface:#221f55;--ink:#f0eeff;--muted:#a9a5dd;--line:#38347a;--accent:#e2407f;--gold:#f2b632;color-scheme:dark}
[data-theme="amethyst"]{--bg:#2b1850;--surface:#3a2268;--ink:#f3eaff;--muted:#c3a9ee;--line:#54368f;--accent:#9d4edd;--gold:#f2b632;color-scheme:dark}
[data-theme="emerald"]{--bg:#e1f6ec;--surface:#fff;--ink:#0f3d2e;--muted:#4c7a69;--line:#bfe5d3;--accent:#0b8a5e;--gold:#e0a21c;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px}
.bar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:22px}
.bar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
select{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;font-size:14px}
h1{font:800 clamp(26px,6vw,40px)/1.15 Unbounded,sans-serif;margin:0 0 8px}
p.sub{margin:0 0 20px;color:var(--muted)}
input{width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ol{list-style:none;margin:0;padding:0;display:grid;gap:12px}
li{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px 10px 16px}
li.empty{justify-content:center;color:var(--muted)}
.pos{font:800 22px Unbounded,sans-serif;min-width:2.2ch;color:var(--muted)}
li:first-child .pos{color:var(--gold)}
.thumb{flex:none;width:128px;aspect-ratio:16/9;border-radius:8px;background:var(--line);object-fit:cover;display:block}
.thumb.none{display:grid;place-items:center;color:var(--muted);font-size:12px}
.info{min-width:0;flex:1}
.name{font-weight:700;margin:0;overflow-wrap:anywhere}
.by{color:var(--muted);font-size:14px}
.hero{background:#1d1a4a url(header-bg.jpg) right center/cover no-repeat;border-radius:18px;padding:30px 22px 34px;margin:0 0 18px;box-shadow:0 4px 0 var(--line)}
.hero h1{margin:0 0 8px;max-width:20ch;color:#fff;background:linear-gradient(90deg,#ff3b3b,#ff9a3b,#ffe63b,#4ee05a,#3bd9e0,#3b82ff,#8b5cff,#ff5ccf,#ff3b3b);background-size:100% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow 6s linear infinite}
@keyframes rainbow{to{background-position:100% center}}
@media (prefers-reduced-motion:reduce){.hero h1{animation:none}}
.hero p.sub{color:#ffd166;margin:0;max-width:34ch}
.menu-btn{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-content:center;gap:5px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.menu-btn span{display:block;width:20px;height:3px;border-radius:2px;background:var(--ink)}
.menu-btn:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.scrim{position:fixed;inset:0;background:rgba(10,8,30,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.menu{position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);background:var(--surface);color:var(--ink);border-left:2px solid var(--line);padding:18px 18px 28px;overflow-y:auto;transform:translateX(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;z-index:21;box-shadow:-8px 0 24px rgba(0,0,0,.25)}
.menu.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.menu h2{font:800 20px Unbounded,sans-serif;margin:0}
.menu h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.menu-close{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.menu .tabs{flex-direction:column;margin:0 0 4px}
.menu label{display:grid;gap:6px;margin:0 0 14px;font-size:14px;color:var(--muted)}
.menu select{width:100%}
.menu ol{margin-bottom:6px}
.menu li{flex-wrap:wrap}
.menu .thumb{width:100%;order:3}
.menu .info{flex:1 1 60%}
.mplayer{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin:0 0 12px;text-align:center}
.mstage{position:relative;height:156px;overflow:hidden;transition:height .3s}
.mplayer.spec .mstage{height:224px}
.mcanvas{position:absolute;left:50%;top:50%;width:224px;height:224px;margin:-112px 0 0 -112px;opacity:0;transition:opacity .3s;pointer-events:none}
.mplayer.spec .mcanvas{opacity:1}
.mdisc{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px}
.mdisc i{position:relative;display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 3px 10px rgba(0,0,0,.28);animation:spin 6s linear infinite;animation-play-state:paused;
  background:radial-gradient(circle,var(--surface) 0 8%,rgba(0,0,0,.18) 8% 10%,var(--accent) 10% 30%,transparent 30%),
  conic-gradient(#eceaf8,#9fb4ff,#f6c8ee,#eceaf8,#a8f0d8,#fff1b0,#eceaf8,#b9a8ff,#eceaf8)}
.mplayer.playing .mdisc i{animation-play-state:running}
.mdisc i b{position:absolute;left:46%;top:46%;width:8%;height:8%;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(0,0,0,.45)}
.mtitle{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.martist{color:var(--muted);font-size:14px;min-height:21px}
.mplayer input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;padding:0;margin:6px 0 0;border:0;border-radius:0;background:transparent;cursor:pointer}
.mplayer input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
.mplayer input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.mplayer input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.mplayer input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
.mplayer input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.mtimes{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 0 10px;font-variant-numeric:tabular-nums}
.mctrl{display:flex;justify-content:center;align-items:center;gap:16px}
.mctrl button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.mctrl button.main{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.mctrl button:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.menu li.trk{flex-wrap:nowrap;gap:12px;padding:8px 10px;cursor:pointer}
.trk.active{border-color:var(--accent)}
.trk.active .name{color:var(--accent)}
.trk.noaudio{opacity:.65;cursor:default}
.tart{flex:none;width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--line);display:block}
.tinfo{min-width:0;flex:1}
.trk .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .by{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlisten{flex:none;font-size:12px;font-weight:700;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:1px 8px;text-decoration:none}
.eq{display:none;align-items:flex-end;gap:2px;height:16px;width:18px;flex:none}
.eq i{display:block;width:4px;height:4px;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}
.eq i:nth-child(3){animation-delay:-.6s}
.trk.now .eq{display:inline-flex}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.mini{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 28px));transform:translate(-50%,160%);visibility:hidden;transition:transform .3s,visibility 0s .3s;z-index:15;display:flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:0 6px 20px rgba(0,0,0,.25);overflow:hidden}
.mini.show{transform:translate(-50%,0);visibility:visible;transition:transform .3s}
.mini::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--p,0%);background:var(--accent)}
.mini-info{flex:1;min-width:0;text-align:left;background:none;border:0;color:inherit;font:inherit;font-weight:700;padding:8px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini button.ic{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer}
.mini button.ic.x{background:transparent;color:var(--muted);font-size:24px;line-height:1}
body.has-mini .wrap{padding-bottom:110px}
@media (prefers-reduced-motion:reduce){.mdisc i,.eq i{animation:none}}
.tabs{display:flex;gap:8px;margin:0 0 16px}
.tabs button{flex:1;font:inherit;font-weight:700;color:var(--muted);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tabs button:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;padding-bottom:3px}
.links a{font-size:13px;font-weight:700;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:2px 10px;text-decoration:none}
.links a.show{background:var(--accent);border-color:var(--accent);color:#fff}
.links button.music{background:linear-gradient(90deg,var(--line) var(--p,0%),transparent var(--p,0%));font:inherit;font-size:13px;font-weight:700;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:2px 10px;cursor:pointer}
.links button.music[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.disc{position:absolute;top:12px;right:14px;width:88px;height:88px;pointer-events:none;opacity:0;transform:translateX(150px);transition:transform .5s cubic-bezier(.2,.9,.3,1.15),opacity .3s}
.disc.in{opacity:1;transform:translateX(0)}
.disc i{position:relative;display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 3px 10px rgba(0,0,0,.28);animation:spin 2.2s linear infinite;
  background:radial-gradient(circle,var(--surface) 0 8%,rgba(0,0,0,.18) 8% 10%,var(--accent) 10% 30%,transparent 30%),
  conic-gradient(#eceaf8,#9fb4ff,#f6c8ee,#eceaf8,#a8f0d8,#fff1b0,#eceaf8,#b9a8ff,#eceaf8)}
.spectro{flex:1 1 100%;height:0;margin-top:-14px;overflow:hidden;opacity:0;pointer-events:none;transition:height .35s ease,margin-top .35s ease,opacity .3s}
.spectro.in{height:64px;margin-top:0;opacity:1}
.spectro canvas{display:block;width:100%;height:64px}
.disc-art{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.disc-label{position:absolute;left:27%;top:27%;width:46%;height:46%;border-radius:50%;object-fit:cover;background:var(--line);box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.disc i b{position:absolute;left:46%;top:46%;width:8%;height:8%;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(0,0,0,.45)}
@keyframes spin{to{transform:rotate(360deg)}}
li.playing .info{padding-right:96px}
@media (prefers-reduced-motion:reduce){.disc i{animation:none}}
.links a,.links button.music{box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.links a.show{box-shadow:0 3px 0 rgba(0,0,0,.28)}
.links a:active,.links button.music:active{transform:translateY(3px);box-shadow:0 0 0 transparent}

@media (max-width:520px){li{flex-wrap:wrap}.thumb{width:100%;order:3}.info{flex:1 1 60%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button type="button" id="menuBtn" class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
  </div>
  <header class="hero">
  <h1 data-t="title">Dancing Line Fanmade Level Lists</h1>
  <p class="sub" id="sub">A list for Dancing Line Fanmade Levels</p>
  </header>
  <input type="search" id="q" data-t-ph="search" placeholder="Search levels">
  <ol id="list"></ol>
</div>
<div id="scrim" class="scrim"></div>
<aside id="menu" class="menu" aria-hidden="true" aria-label="Settings">
  <div class="menu-head"><h2 data-t="menu">Menu</h2><button type="button" id="menuClose" class="menu-close" aria-label="Close">&times;</button></div>
  <h3 data-t="tabMusic">Music</h3>
  <div class="mplayer" id="mplayer">
    <div class="mstage">
      <canvas class="mcanvas" id="mcanvas"></canvas>
      <div class="mdisc" aria-hidden="true"><i><img class="disc-art" id="mart" alt="" onerror="this.style.display='none'"><img class="disc-label" id="mlabel" alt="" style="display:none" onerror="this.style.display='none'"><b></b></i></div>
    </div>
    <div class="mtitle" id="mTitle"></div>
    <div class="martist" id="mArtist"></div>
    <input type="range" id="mSeek" min="0" max="1000" value="0" step="1">
    <div class="mtimes"><span id="mCur">0:00</span><span id="mDur">0:00</span></div>
    <div class="mctrl">
      <button type="button" id="mPrev"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12L19 6v12z" fill="currentColor"/></svg></button>
      <button type="button" id="mPlay" class="main"></button>
      <button type="button" id="mNext"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M16 6h2v12h-2zM5 6v12l9.5-6z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <ol id="musicList"></ol>
  <h3 data-t="settings">Settings</h3>
    <label><span data-t="language">Language</span>
      <select id="lang"><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label>
    <label><span data-t="viz">Preview style</span>
      <select id="viz">
        <option value="disc" data-t="vizDisc">Disc</option>
        <option value="spectro" data-t="vizSpectro">Spectrogram</option>
      </select></label>
    <label><span data-t="theme">Theme</span>
      <select id="theme">
        <option value="amethyst" data-t="amethyst">Amethyst</option>
        <option value="default" data-t="default">Default</option>
        <option value="dark" data-t="dark">Dark</option>
        <option value="emerald" data-t="emerald">Emerald</option>
      </select></label>
</aside>
<div id="mini" class="mini" role="region">
  <button type="button" id="miniOpen" class="mini-info"><span id="miniTitle"></span></button>
  <button type="button" id="miniPlay" class="ic"></button>
  <button type="button" id="miniStop" class="ic x">&times;</button>
</div>
<script src="lists.js"></script>
<script src="musiclist.js"></script>
<script>
/* ===== LEVEL DETAILS (set once, never needs moving) =====
   The ranking order is in lists.js. Here you only add info for each level.
   The name must match the name in lists.js exactly.
   creator  = who made it
   showcase = showcase video link (YouTube gives an automatic thumbnail)
   link     = play/download link (optional)
   thumb    = own thumbnail, e.g. "thumbs/level1.jpg" (optional)
   music    = short audio file for the preview (optional), in your repo, e.g.
              "music/level1.mp3". Adds a Preview button. Audio only, no video.
   musicStart  = second the preview starts at (optional, default 0), e.g. 45
   musicEnd    = second the preview stops at (optional, default start + 15), e.g. 62
              The preview stops by itself at that second. */
const INFO = {
  "The Samsara": { creator:"Pegasi", showcase:"https://youtu.be/fHpiDxDjP-c?si=pZHpi6iKYursBlzd", link:"https://drive.google.com/open?id=13Q3hbsj9C-HHp-X_0yoCwqbp7qJF3FEQ", thumb:"thumbs/maxresdefault.jpg", music:"Music/Samsara.mp3", musicStart:17, musicEnd:35 },
  "The Rock":    { creator:"Theo5970", showcase:"https://youtu.be/B25iHCA_dlc?si=WfM0OUuxUWQVd40H", link:"https://drive.google.com/file/d/1cocUO-wXCbHOXoDvGAI6ML0MthUaOztc/view?usp=drivesdk", thumb:"thumbs/thumb1.jpg", music:"Music/Rock.mp3", musicStart:0, musicEnd:15 },
  "White Realm II": { creator: "CXY-Chen", showcase:"https://youtu.be/u12OrH1eGAc?si=FZAuAbo8XxsgwvTn", link:"https://m.chinadlrs.com", music:"Music/WhiteRealm2.mp3", musicStart:1, musicEnd:15 },
  "Storm of Anger": { creator: "FengYan", showcase:"https://youtu.be/GqeARenMMcQ?si=YRV-qUKmsd7Tg_0m", link:"https://m.chinadlrs.com", music:"Music/Storm.mp3", musicStart:25, musicEnd:40 },
  "The Mathematics": { creator: "LigaYb", showcase:"https://youtu.be/sjy8oRq-T-8?si=pDvegGsXTXSOdIdQ", link:"https://drive.google.com/file/d/10DS2tOt2BnyKB8yvyYXLmOjicn5M0pvb/view", music:"Music/Mathmathetics.mp3", musicStart:0, musicEnd:15 },
  "The Forest": { creator:"LigaYb", showcase:"https://youtu.be/HteGhvnTkEc?si=4BaRB4is2vSBRFYb", link:"https://drive.google.com/file/d/1uA-hmnKmr1brlph6ES5Tfij2Nf7QRrPV/view", music:"Music/Forest.mp3", musicStart:0, musicEnd:15 },
  "The Garden": { creator:"LigaYb", showcase:"https://youtu.be/pa8VUG0Yh6Y?si=ZiZSU4PSrQMeIFoC", music:"Music/Garden.mp3", musicStart:1, musicEnd:15 },
  "The Jupiter": { creator:"LigaYb", showcase:"https://youtu.be/n1SU05OKMdc?si=ud1c4qU5FFFFF4AS", music:"Music/Jupiter.mp3", musicStart:4, musicEnd:15 },
  "The Chemistry": { creator:"LigaYb", showcase:"https://youtu.be/O-ZQYh2wz6U?si=Dd2VE6MNnMalvwsP", music:"Music/Chemistry.mp3", musicStart:3, musicEnd:15 },
  "The Gemini": { creator:"LigaYb", showcase:"https://youtu.be/x5BikB9-4o4?si=whklt6cLTTHjK24j", link:"https://drive.google.com/file/d/1IgfNPjNV2Os558QbnAjYMeu1I93nWiuk/view?usp=sharing", music:"Music/Gemini.mp3", musicStart:1, musicEnd:15 },

P.miniStop.addEventListener("click", pStop);
P.miniOpen.addEventListener("click", () => openMenu());
P.seek.addEventListener("input", () => {
  pDragging = true;
  const v = +P.seek.value;
  P.seek.style.setProperty("--p", v / 10 + "%");
  P.cur.textContent = fmt(v / 1000 * pLen);
});
P.seek.addEventListener("change", () => {
  if (pAudio) pAudio.currentTime = pStart + (+P.seek.value) / 1000 * pLen;
  pDragging = false;
});
musicListEl.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const li = e.target.closest("li.trk");
  if (!li || li.classList.contains("noaudio")) return;
  const i = +li.dataset.i;
  if (i === pIdx && pAudio && !pError) togglePlay(); else playTrack(i);
});
musicListEl.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const li = e.target.closest("li.trk");
  if (!li || li.classList.contains("noaudio")) return;
  e.preventDefault();
  li.click();
});
try {
  if ("mediaSession" in navigator) {
    const ms = navigator.mediaSession;
    ms.setActionHandler("play", () => { if (!pAudio || pAudio.paused) togglePlay(); });
    ms.setActionHandler("pause", () => { if (pAudio && !pAudio.paused) togglePlay(); });
    ms.setActionHandler("previoustrack", () => pNext(-1));
    ms.setActionHandler("nexttrack", () => pNext(1));
  }
} catch(e) {}
function setLang(v){
  lang = TEXT[v] ? v : "en";
  document.documentElement.lang = lang;
  langSel.value = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T()[el.dataset.t]);
  document.getElementById("sub").textContent = T().sub;
  q.placeholder = T().search;
  q.setAttribute("aria-label", T().search);
  document.title = T().title;
  menuBtn.setAttribute("aria-label", T().menu);
  menuClose.setAttribute("aria-label", T().close);
  menuEl.setAttribute("aria-label", T().menu);
  store.set("dl-lang", lang);
  render();
}
function setTheme(v){
  v = THEMES.includes(v) ? v : "default";
  document.documentElement.dataset.theme = v;
  themeSel.value = v;
  store.set("dl-theme", v);
}
langSel.addEventListener("change", () => setLang(langSel.value));
themeSel.addEventListener("change", () => setTheme(themeSel.value));
vizSel.value = viz;
vizSel.addEventListener("change", () => { viz = vizSel.value === "spectro" ? "spectro" : "disc"; store.set("dl-viz", viz); playerVizChanged(); });
q.addEventListener("input", render);
const menuEl = document.getElementById("menu"), scrim = document.getElementById("scrim");
const menuBtn = document.getElementById("menuBtn"), menuClose = document.getElementById("menuClose");
function openMenu(){
  menuEl.classList.add("open"); scrim.classList.add("open");
  menuEl.setAttribute("aria-hidden","false"); menuBtn.setAttribute("aria-expanded","true");
  updateMini();
  menuClose.focus();
}
function closeMenu(){
  if (!menuEl.classList.contains("open")) return;
  if (curLi && menuEl.contains(curLi)) stopMusic();
  menuEl.classList.remove("open"); scrim.classList.remove("open");
  menuEl.setAttribute("aria-hidden","true"); menuBtn.setAttribute("aria-expanded","false");
  updateMini();
  menuBtn.focus();
}
menuBtn.addEventListener("click", () => menuEl.classList.contains("open") ? closeMenu() : openMenu());
menuClose.addEventListener("click", closeMenu);
scrim.addEventListener("click", closeMenu);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
if (location.hash === "#music") openMenu();
setTheme(store.get("dl-theme"));
setLang(store.get("dl-lang") || ((navigator.language || "").toLowerCase().startsWith("vi") ? "vi" : "en"));
</script>
</body>
</html>
